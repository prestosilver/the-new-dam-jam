<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>2026 GMTK</title>
    <style>
      body {
        margin: 0;
        background: black;
      }
      .emscripten {
        padding-right: 0;
        margin-left: 0;
        display: block;
      }
      keyboardProxy {
        padding-right: 0;
        margin-left: 0;
        display: block;
      }
      textarea.emscripten {
        font-family: monospace;
        width: 80%;
      }
      div.emscripten {
        text-align: center;
      }
      div.emscripten_border {
        border: 1px solid black;
      }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */

      .canvas-holder {
        display: flex;
        justify-content: center; /* Centers horizontally */
        align-items: center; /* Centers vertically */
        height: 100vh; /* Ensures the container fills the viewport height */
        background: black;
      }
      
      input.emscripten {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Prevent blur on resize */
        -ms-interpolation-mode: nearest-neighbor;
      }

      keyboardProxy {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Prevent blur on resize */
        -ms-interpolation-mode: nearest-neighbor;
      }

      canvas.emscripten:focus {
        outline: none;
      }
      
      @-webkit-keyframes rotation {
        from {
          -webkit-transform: rotate(0deg);
        }
        to {
          -webkit-transform: rotate(360deg);
        }
      }
      @-moz-keyframes rotation {
        from {
          -moz-transform: rotate(0deg);
        }
        to {
          -moz-transform: rotate(360deg);
        }
      }
      @-o-keyframes rotation {
        from {
          -o-transform: rotate(0deg);
        }
        to {
          -o-transform: rotate(360deg);
        }
      }
      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="emscripten" id="status"></div>
    <div class="canvas-holder">
      <input
        type="text"
         id="keyboardProxy"
        style="position: absolute; pointer-events: none; opacity: 0.0; top: 0; left: 0; width: 100%; height: 100%;"
      ></input>
      <canvas
        class="emscripten"
        id="canvas"
        style="background: black;"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      >
      </canvas>
    </div>
    <script src="client.js"></script>
    <script type="text/javascript">
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var proxyInput = document.getElementById('keyboardProxy');

        var keyboardPtr;
        var keyboardMaxLen = 0;

        function showKeyboard(pointer, max_length) {
            keyboardPtr = pointer;
            keyboardMaxLen = max_length;

            const fullView = new Uint8Array(wasmMemory.buffer, pointer);
            const length = fullView.indexOf(0);
            if (length === -1) {
                throw new Error("String is not null-terminated");
            }
            
            const stringView = new Uint8Array(wasmMemory.buffer, pointer, length);
            proxyInput.value = new TextDecoder("utf-8").decode(stringView);
            proxyInput.focus();
            
            console.log(proxyInput.value);
        };
        
        function hideKeyboard() {
            keyboardMaxLen = 0;
            proxyInput.blur();
        };

        function keyboardSet() {
            if (keyboardMaxLen < 1) return;
            if (proxyInput.value.length > keyboardMaxLen) proxyInput.value.length = proxyInput.value.slice(0, keyboardMaxLen); 
            const tmp_name = proxyInput.value + "\0";
            const encoder = new TextEncoder();
            const stringBytes = encoder.encode(tmp_name);
            const entryBytes = new Uint8Array(wasmMemory.buffer, keyboardPtr, stringBytes.length);
            entryBytes.set(stringBytes);
        };

        proxyInput.addEventListener("input", function (e) {
            keyboardSet();
        });

        
        proxyInput.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace') {
            proxyInput.value = proxyInput.value.slice(0, -1); 
            keyboardSet();
          } else if (e.key === 'Enter') {
          }
        });

        // As a default initial behavior, pop up an alert when webgl context is lost. To make your
        // application robust, you may want to override this behavior before shipping!
        // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
        canvasElement.addEventListener("webglcontextlost", (e) => {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);

        function setStatus(text) {
          if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
          if (text === setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          setStatus.last.time = now;
          setStatus.last.text = text;
          statusElement.innerHTML = text;
        }

#if MODULARIZE && !EXPORT_ES6
        var moduleArgs = {
#else
        var Module = {
#endif
            print(...args) {
              console.log(...args);
            },
            canvas: canvasElement,
            setStatus: setStatus,
            totalDependencies: 0,
            monitorRunDependencies(left) {
              this.totalDependencies = Math.max(this.totalDependencies, left);
            }
        };
        setStatus('Downloading...');
        window.onerror = () => {
          setStatus('Exception thrown, see JavaScript console');
          spinnerElement.style.display = 'none';
          setStatus = (text) => {
            if (text) console.error('[post-exception status] ' + text);
          };
        };
    </script>
    {{{ SCRIPT }}}
#if MODULARIZE && !EXPORT_ES6
    <script type="text/javascript">
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
  </body>
</html>
